<!-- @dsCard group="Foundations" name="Spacing, Radius & Shadow" subtitle="Scale, corner radii, elevation" -->
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Spacing, Radius & Shadow</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #2d3748; background: #f8fafc;
  }
  h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.5px; }
  .sub { color: #64748b; font-size: 14px; margin: 0 0 28px; }
  h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #718096; margin: 30px 0 14px; }
  .bars { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
  .bar b { display: block; background: linear-gradient(135deg,#667eea,#764ba2); border-radius: 4px; }
  .bar span { display: block; font-size: 12px; color: #64748b; margin-top: 6px; text-align: center; }
  .radii { display: flex; gap: 16px; flex-wrap: wrap; }
  .rad { width: 84px; height: 84px; background: linear-gradient(135deg,#667eea,#764ba2); display: flex; align-items: flex-end; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; padding-bottom: 8px; }
  .shadows { display: flex; gap: 24px; flex-wrap: wrap; }
  .sh { width: 130px; height: 90px; background: #fff; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #64748b; font-weight: 600; }
</style>
</head>
<body>
  <h1>Spacing, Radius &amp; Shadow</h1>
  <p class="sub">4px-based spacing, generous corner radii, and layered soft elevation.</p>

  <h2>Spacing scale (px)</h2>
  <div class="bars">
    <div class="bar"><b style="width:8px;height:8px"></b><span>8</span></div>
    <div class="bar"><b style="width:12px;height:12px"></b><span>12</span></div>
    <div class="bar"><b style="width:16px;height:16px"></b><span>16</span></div>
    <div class="bar"><b style="width:20px;height:20px"></b><span>20</span></div>
    <div class="bar"><b style="width:24px;height:24px"></b><span>24</span></div>
    <div class="bar"><b style="width:32px;height:32px"></b><span>32</span></div>
    <div class="bar"><b style="width:48px;height:48px"></b><span>48</span></div>
    <div class="bar"><b style="width:64px;height:64px"></b><span>64</span></div>
  </div>

  <h2>Corner radius (px)</h2>
  <div class="radii">
    <div class="rad" style="border-radius:10px">10</div>
    <div class="rad" style="border-radius:12px">12</div>
    <div class="rad" style="border-radius:16px">16</div>
    <div class="rad" style="border-radius:20px">20</div>
    <div class="rad" style="border-radius:24px">24</div>
    <div class="rad" style="border-radius:28px">28</div>
  </div>

  <h2>Elevation</h2>
  <div class="shadows">
    <div class="sh" style="box-shadow:0 4px 12px rgba(102,126,234,0.15)">soft</div>
    <div class="sh" style="box-shadow:0 10px 30px rgba(0,0,0,0.2)">card</div>
    <div class="sh" style="box-shadow:0 20px 60px rgba(0,0,0,0.3)">modal</div>
    <div class="sh" style="box-shadow:0 8px 25px rgba(102,126,234,0.35)">brand glow</div>
  </div>
</body>
</html>
