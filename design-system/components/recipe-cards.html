<!-- @dsCard group="Components" name="Recipe result cards" subtitle="Numbered list cards" -->
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recipe result cards</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 40px; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 32px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.2); }
  .title { font-size: 36px; font-weight: 800; color: #fff; margin: 0 0 12px; text-shadow: 0 4px 20px rgba(0,0,0,0.3); letter-spacing: -0.5px; }
  .count { font-size: 20px; color: #fff; margin: 0; font-weight: 600; }
  .grid { display: grid; gap: 24px; }

  .card {
    background: #fff; border-radius: 18px; padding: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex; align-items: center; gap: 24px; border: 3px solid transparent;
  }
  .card.hover { transform: translateY(-6px); box-shadow: 0 16px 45px rgba(0,0,0,0.3); border-color: #667eea; }
  .num { min-width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); color: #fff; font-size: 24px; font-weight: 800; border-radius: 14px; box-shadow: 0 6px 16px rgba(102,126,234,0.4); }
  .content { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .name { font-size: 19px; font-weight: 700; color: #2d3748; margin: 0; }
  .card.hover .name { color: #667eea; }
  .arrow { font-size: 32px; color: #667eea; font-weight: 700; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1 class="title">Znalezione przepisy</h1>
      <p class="count">3 przepisy pasujące do składników</p>
    </div>
    <div class="grid">
      <div class="card hover">
        <div class="num">1</div>
        <div class="content"><p class="name">Spaghetti bolognese</p><span class="arrow">&#8594;</span></div>
      </div>
      <div class="card">
        <div class="num">2</div>
        <div class="content"><p class="name">Zapiekanka warzywna</p></div>
      </div>
      <div class="card">
        <div class="num">3</div>
        <div class="content"><p class="name">Risotto z grzybami</p></div>
      </div>
    </div>
  </div>
</body>
</html>
