<!-- @dsCard group="Components" name="Inputs" subtitle="Outlined text field & checkbox states" -->
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inputs</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f8fafc; color: #2d3748;
  }
  .panel { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 20px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
  h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #718096; margin: 24px 0 12px; }
  h2:first-child { margin-top: 0; }

  .field { position: relative; margin-bottom: 8px; }
  .field label {
    position: absolute; top: -8px; left: 12px; background: #fff; padding: 0 6px;
    font-size: 13px; font-weight: 500; color: #64748b;
  }
  .field.focused label { color: #667eea; font-weight: 600; }
  .field input {
    width: 100%; padding: 16px 14px; font-size: 16px; color: #1e293b;
    border: 1px solid #e2e8f0; border-radius: 12px; outline: none; background: #fff;
    transition: all 0.3s ease;
  }
  .field.focused input { border-color: #667eea; box-shadow: 0 4px 20px rgba(102,126,234,0.25); }

  .check-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px; background: #f8fafc; border: 2px solid transparent; margin-bottom: 8px; }
  .check-row.checked { background: #f0f4ff; border-color: #dce7ff; }
  .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #cbd5e0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; }
  .box.on { background: #667eea; border-color: #667eea; }
  .check-row span { font-size: 15px; font-weight: 500; color: #2d3748; }
</style>
</head>
<body>
  <div class="panel">
    <h2>Text field — outlined</h2>
    <div class="field">
      <label>Adres e-mail</label>
      <input type="text" value="anna@example.com" />
    </div>
    <div class="field focused">
      <label>Hasło</label>
      <input type="password" value="••••••••" />
    </div>

    <h2>Checkbox</h2>
    <div class="check-row checked"><div class="box on">&#10003;</div><span>Marchew</span></div>
    <div class="check-row"><div class="box"></div><span>Ziemniaki</span></div>
    <div class="check-row checked"><div class="box on">&#10003;</div><span>Brokuł</span></div>
  </div>
</body>
</html>
