<!-- @dsCard group="Components" name="Feature cards" subtitle="Image cards with checkbox groups" -->
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Feature cards</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    min-height: 100vh;
  }
  .grid { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit,minmax(340px,1fr)); gap: 40px; }
  .card { background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.25); display: flex; flex-direction: column; }
  .img { position: relative; height: 200px; background: linear-gradient(135deg,#8ea2f0 0%,#9a6fc4 100%); }
  .img .veil { position: absolute; inset: 0; background: linear-gradient(180deg,rgba(0,0,0,0.1) 0%,rgba(102,126,234,0.7) 100%); }
  .img .cap { position: absolute; bottom: 20px; left: 28px; font-size: 32px; font-weight: 800; color: #fff; text-shadow: 0 4px 15px rgba(0,0,0,0.4); letter-spacing: -0.5px; z-index: 1; }
  .content { padding: 36px 28px; }
  .checks { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px 20px; }
  .chk { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px; background: #f8fafc; border: 2px solid transparent; }
  .chk.on { background: #f0f4ff; border-color: #dce7ff; }
  .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid #cbd5e0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; }
  .box.on { background: #667eea; border-color: #667eea; }
  .chk span { font-size: 15px; color: #2d3748; font-weight: 500; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <div class="img"><div class="veil"></div><div class="cap">Warzywa</div></div>
      <div class="content">
        <div class="checks">
          <div class="chk on"><div class="box on">&#10003;</div><span>Marchew</span></div>
          <div class="chk"><div class="box"></div><span>Ziemniaki</span></div>
          <div class="chk on"><div class="box on">&#10003;</div><span>Brokuł</span></div>
          <div class="chk"><div class="box"></div><span>Cukinia</span></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="img"><div class="veil"></div><div class="cap">Makarony</div></div>
      <div class="content">
        <div class="checks">
          <div class="chk"><div class="box"></div><span>Spaghetti</span></div>
          <div class="chk on"><div class="box on">&#10003;</div><span>Penne</span></div>
          <div class="chk"><div class="box"></div><span>Farfalle</span></div>
          <div class="chk"><div class="box"></div><span>Tagliatelle</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
