<!-- @dsCard group="Components" name="Alerts" subtitle="Error banner" -->
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Alerts</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f8fafc;
  }
  .panel { max-width: 460px; margin: 0 auto; }
  h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #718096; margin: 0 0 12px; }
  .error {
    background: linear-gradient(135deg,#ef4444 0%,#dc2626 100%);
    color: #fff; padding: 12px 16px; border-radius: 12px; margin-bottom: 16px;
    box-shadow: 0 4px 12px rgba(239,68,68,0.25);
  }
  .error p { margin: 0; font-size: 14px; font-weight: 500; text-align: center; }
</style>
</head>
<body>
  <div class="panel">
    <h2>Form error</h2>
    <div class="error"><p>Nieprawidłowy e-mail lub hasło</p></div>
    <div class="error"><p>Zbyt wiele prób. Spróbuj później</p></div>
    <div class="error"><p>Błąd sieci. Sprawdź połączenie</p></div>
  </div>
</body>
</html>
