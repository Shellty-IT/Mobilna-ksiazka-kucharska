<!-- @dsCard group="Components" name="Login card" subtitle="Auth form on brand backdrop" -->
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login card</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 20px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
  }
  .container { width: 100%; max-width: 380px; }
  .header { text-align: center; margin-bottom: 24px; }
  .title { font-size: 28px; font-weight: 800; color: #fff; margin: 0 0 8px; text-shadow: 0 4px 20px rgba(0,0,0,0.2); letter-spacing: -0.5px; }
  .subtitle { font-size: 14px; color: rgba(255,255,255,0.95); margin: 0; }

  .card { background: rgba(255,255,255,0.98); border-radius: 20px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); position: relative; overflow: hidden; }
  .card::before { content:''; position: absolute; top:0; left:0; right:0; height:4px; background: linear-gradient(90deg,#667eea,#764ba2,#667eea); }

  .field { position: relative; margin-bottom: 24px; }
  .field label { position: absolute; top:-8px; left:12px; background:#fff; padding:0 6px; font-size:13px; font-weight:500; color:#64748b; }
  .field.focused label { color:#667eea; font-weight:600; }
  .field input { width:100%; padding:16px 14px; font-size:16px; color:#1e293b; border:1px solid #e2e8f0; border-radius:12px; outline:none; }
  .field.focused input { border-color:#667eea; box-shadow:0 4px 20px rgba(102,126,234,0.25); }

  .btn { width:100%; padding:16px 32px; border:none; border-radius:12px; font-size:16px; font-weight:700; color:#fff; cursor:pointer;
    background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); box-shadow:0 8px 25px rgba(102,126,234,0.35); }

  .footer { text-align:center; margin-top:16px; padding-top:16px; border-top:2px solid #f1f5f9; }
  .footer p { color:#64748b; font-size:14px; margin:0 0 12px; font-weight:500; }
  .footer a { color:#667eea; text-decoration:none; font-weight:700; font-size:15px; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">Zaloguj się</h1>
      <p class="subtitle">Witaj ponownie! Zaloguj się do swojego konta</p>
    </div>
    <div class="card">
      <div class="field">
        <label>Adres e-mail</label>
        <input type="text" value="anna@example.com" />
      </div>
      <div class="field focused">
        <label>Hasło</label>
        <input type="password" value="••••••••" />
      </div>
      <button class="btn">Zaloguj</button>
      <div class="footer">
        <p>Nie masz jeszcze konta?</p>
        <a href="#">Zarejestruj się</a>
      </div>
    </div>
  </div>
</body>
</html>
